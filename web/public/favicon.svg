<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
    <!--
        The header's book mark (src/components/AppLogo.vue) on an indigo tile.
        Two deliberate deviations from the component, both for legibility at 16px,
        where a favicon actually lives: the four page-line bars are dropped and the
        frame is stroked to thicken it. Keeping them faithful smears the whole glyph
        into a pale blob in the browser tab.
        Colours are literal: an SVG favicon renders outside the document, so the
        component's `currentColor` would resolve to black here.
    -->
    <rect width="32" height="32" rx="6" fill="#4f46e5" />
    <g fill="#fff" transform="translate(1.818 0.046) scale(1.1818)">
        <path d="M12 21c-1.104 0-2 .896-2 2h4c0-1.104-.896-2-2-2z" />
        <path
            d="M21 4H3c-1.103 0-2 .897-2 2v13c0 1.103.897 2 2 2h18c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2zM3 19V6h8v13H3zm18 0h-8V6h8v13z"
            stroke="#fff"
            stroke-width=".8"
            stroke-linejoin="round"
        />
    </g>
</svg>
